<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | Page Not Found</title>
<meta name="description" content="The page you are looking for could not be found.">
<link rel="icon" href="assets/images/brand-logo.webp">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="assets/css/global.css">
<link rel="stylesheet" href="assets/css/404.css">
</head>
<body>
<!--- 404 Page --->
<main class="fn-404-page">
<div class="fn-404-background">

<div class="fn-404-glow fn-404-glow-one"></div>
<div class="fn-404-glow fn-404-glow-two"></div>
<div class="fn-404-particles" id="fn-404-particles"></div>
</div>
<!--- 404 Content --->
<div class="container fn-404-container">
<div class="fn-404-content">
<a href="index.html" class="fn-404-logo">
<img src="assets/images/brand-logo.webp" alt="Finance Logo">
</a>
<div class="fn-404-visual">
<div class="fn-404-chart">
<svg viewBox="0 0 700 220" preserveAspectRatio="none" aria-hidden="true">
<defs>
<linearGradient id="fn404ChartGradient" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#16c784"></stop>
<stop offset="100%" stop-color="#2563eb"></stop>
</linearGradient>
</defs>
<path class="fn-404-chart-line" d="M0 175 C70 155 85 120 145 145 C205 170 220 75 280 105 C335 132 360 90 410 115 C465 145 490 45 550 75 C605 105 625 30 700 48"></path>
</svg>
</div>
<div class="fn-404-number">
<span>4</span>
<div class="fn-404-number-chart">
<i class="bi bi-graph-up-arrow"></i>
</div>
<span>4</span>
</div>
<div class="fn-404-floating fn-404-floating-one"><i class="bi bi-bar-chart-line"></i></div>
<div class="fn-404-floating fn-404-floating-two"><i class="bi bi-currency-dollar"></i></div>
<div class="fn-404-floating fn-404-floating-three"><i class="bi bi-pie-chart"></i></div>
<div class="fn-404-floating fn-404-floating-four"><i class="bi bi-wallet2"></i></div>
</div>
<!--- 404 Message --->
<div class="fn-404-message">
<span class="fn-404-label"><i class="bi bi-exclamation-circle"></i> Page Not Found</span>
<h1 class="fn-404-title">Looks like this page <span>lost its way.</span></h1>
<p class="fn-404-description">The financial page you're looking for doesn't exist, may have moved, or is temporarily unavailable.</p>
</div>
<!--- 404 Actions --->
<div class="fn-404-actions">
<button type="button" class="fn-404-back-btn" id="fn-404-back-btn"><i class="bi bi-arrow-left"></i><span>Go Back</span></button>
<a href="index.html" class="fn-404-home-btn"><span>Go to Home</span><i class="bi bi-arrow-up-right"></i></a>
</div>
<!--- 404 Status --->
<div class="fn-404-status">
<span class="fn-404-status-dot"></span>
<span>Error Code 404</span>
<span class="fn-404-status-divider"></span>
<span>Page unavailable</span>
</div>
</div>
</div>
</main>
<script src="assets/js/404.js"></script>

</html>
